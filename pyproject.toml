[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-ai-trader"
version = "0.1.0"
description = "Autonomous, safety-first research and execution platform for spot crypto trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "httpx>=0.27,<1",
  "structlog>=24.4,<26",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "setuptools>=83,<84",
]

[project.scripts]
advanced-ai-trader = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "data", "execution", "intelligence", "research", "security", "simulation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "data", "execution", "intelligence", "research", "security", "simulation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
