name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e '.[dev]'
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Ruff auto-fix
        run: ruff check --fix .
      - name: Ruff verify
        run: ruff check .
      - name: Mypy
        run: mypy app core data execution intelligence research security simulation
      - name: Tests
        run: pytest -q
