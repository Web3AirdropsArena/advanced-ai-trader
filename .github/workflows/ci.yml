name: CI

on:
  push:
    branches: [main, foundation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff auto-fix
        run: ruff check --fix .
      - name: Ruff verify
        run: ruff check .
      - name: Mypy
        run: mypy app core data execution intelligence research security simulation
      - name: Tests
        run: pytest -q
